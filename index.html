<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://generativelanguage.googleapis.com" />
  <title>Reality Check</title>
</head>
<body style="margin:0;">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    fetch("app.js")
      .then((r) => r.text())
      .then((code) => {
        const out = Babel.transform(code, { presets: [["react", { runtime: "classic" }]] }).code;
        const script = document.createElement("script");
        script.textContent = out;
        document.body.appendChild(script);
      });
  </script>
</body>
</html>
